<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Lumen TV: this page shows live data (the countdown), so always run it live rather than as the pre-rendered video -->
<meta name="lumen-playback" content="live">
<title>Christmas Village Background v2</title>
<style>
  html,body{margin:0;height:100%;background:#0b1437;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(5,8,30,.5) 100%)}
  #cd{position:fixed;left:50%;top:clamp(70px,11vh,110px);transform:translateX(-50%);text-align:center;
      font-family:Georgia,'Palatino Linotype','Times New Roman',serif;color:#fff;pointer-events:none;
      padding:14px 26px 16px;border-radius:22px;
      background:linear-gradient(180deg,rgba(20,30,80,.55),rgba(10,15,50,.55));
      border:1.5px solid rgba(255,220,140,.55);
      box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 40px rgba(255,200,100,.18),inset 0 0 20px rgba(255,255,255,.06);
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:92vw;box-sizing:border-box}
  #cd .t{font-size:clamp(13px,1.9vw,19px);letter-spacing:.22em;text-transform:uppercase;color:#ffe9a8;
      text-shadow:0 0 12px rgba(255,200,100,.6);margin-bottom:10px}
  #cd .row{display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center}
  #cd .b{min-width:clamp(52px,8vw,84px);padding:8px 6px 7px;border-radius:14px;
      background:linear-gradient(180deg,#d62839,#8c1020);border:1px solid rgba(255,255,255,.35);
      box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  #cd .b:nth-child(even){background:linear-gradient(180deg,#2f9a54,#145a2c)}
  #cd .n{display:block;font-size:clamp(24px,4.4vw,46px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
      text-shadow:0 2px 6px rgba(0,0,0,.4)}
  #cd .l{display:block;margin-top:5px;font-size:clamp(9px,1.2vw,12px);letter-spacing:.16em;text-transform:uppercase;opacity:.9}
  #cd.done .t{font-size:clamp(20px,4vw,40px);letter-spacing:.08em;margin:0}
  #cd.done .row{display:none}
  /* slow devices (TV sticks): a live backdrop blur over the animated scene costs ~25% of the frame */
  .lite #cd{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,rgba(20,30,80,.8),rgba(10,15,50,.8))}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="cd"><div class="t" id="cdt">Christmas is coming</div>
  <div class="row">
    <div class="b"><span class="n" id="cdd">--</span><span class="l">Days</span></div>
    <div class="b"><span class="n" id="cdh">--</span><span class="l">Hours</span></div>
    <div class="b"><span class="n" id="cdm">--</span><span class="l">Minutes</span></div>
    <div class="b"><span class="n" id="cds">--</span><span class="l">Seconds</span></div>
  </div>
</div>
<script>
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
/* Perf: on the Mali-G31 (TV sticks) Skia rasterizes curved strokes and concave / multi-shape paths on
   the CPU and re-uploads a mask every frame. Convex fills and image draws stay on the GPU. This shim
   records path geometry on the on-screen context and draws each stroke as separate convex quads
   (+ round caps / joins). Offscreen bakes keep native strokes. */
(function strokeShim(c){
  let subs=[],cur=null,start=null;
  const bp=c.beginPath.bind(c),mt=c.moveTo.bind(c),lt=c.lineTo.bind(c),cp=c.closePath.bind(c),
        qc=c.quadraticCurveTo.bind(c),bz=c.bezierCurveTo.bind(c),ar=c.arc.bind(c),el=c.ellipse.bind(c),rc=c.rect.bind(c),fl=c.fill.bind(c);
  const last=()=>cur[cur.length-1];
  const ensure=(x,y)=>{if(!cur){cur=[start?start.slice():[x,y]];subs.push(cur)}};
  c.beginPath=function(){subs=[];cur=null;start=null;bp()};
  c.moveTo=function(x,y){cur=[[x,y]];subs.push(cur);start=null;mt(x,y)};
  c.lineTo=function(x,y){ensure(x,y);cur.push([x,y]);lt(x,y)};
  c.quadraticCurveTo=function(cx,cy,x,y){ensure(cx,cy);const [x0,y0]=last();
    for(let i=1;i<=5;i++){const u=i/5,v=1-u;cur.push([v*v*x0+2*v*u*cx+u*u*x,v*v*y0+2*v*u*cy+u*u*y])}qc(cx,cy,x,y)};
  c.bezierCurveTo=function(a,b,d,e,x,y){ensure(a,b);const [x0,y0]=last();
    for(let i=1;i<=6;i++){const u=i/6,v=1-u;cur.push([v*v*v*x0+3*v*v*u*a+3*v*u*u*d+u*u*u*x,v*v*v*y0+3*v*v*u*b+3*v*u*u*e+u*u*u*y])}bz(a,b,d,e,x,y)};
  const arcPts=(x,y,rx,ry,rot,a0,a1,ccw)=>{
    let sw=a1-a0;
    if(Math.abs(sw)>=Math.PI*2)sw=ccw?-Math.PI*2:Math.PI*2;
    else{if(!ccw&&sw<0)sw+=Math.PI*2;if(ccw&&sw>0)sw-=Math.PI*2}
    const n=Math.min(16,Math.max(3,Math.ceil(Math.abs(sw)*Math.max(rx,ry)/4))),cr=Math.cos(rot),sr=Math.sin(rot);
    const out=[];for(let i=0;i<=n;i++){const a=a0+sw*i/n,px=Math.cos(a)*rx,py=Math.sin(a)*ry;out.push([x+px*cr-py*sr,y+px*sr+py*cr])}
    return out;
  };
  c.arc=function(x,y,r,a0,a1,ccw){if(!cur){cur=[];subs.push(cur)}cur.push(...arcPts(x,y,r,r,0,a0,a1,ccw));ar(x,y,r,a0,a1,ccw)};
  c.ellipse=function(x,y,rx,ry,rot,a0,a1,ccw){if(!cur){cur=[];subs.push(cur)}cur.push(...arcPts(x,y,rx,ry,rot,a0,a1,ccw));el(x,y,rx,ry,rot,a0,a1,ccw)};
  c.rect=function(x,y,w,h){const r=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];r.closed=true;subs.push(r);cur=null;start=[x,y];rc(x,y,w,h)};
  c.closePath=function(){if(cur){cur.closed=true;start=cur[0];cur=null}cp()};
  c.stroke=function(p2d){
    if(p2d)return CanvasRenderingContext2D.prototype.stroke.call(c,p2d);
    const hw=c.lineWidth/2,capR=c.lineCap==='round',joinR=hw>=1.4,fs=c.fillStyle,ga=c.globalAlpha,saved=subs;
    c.fillStyle=c.strokeStyle;if(c.getLineDash().length)c.globalAlpha=ga*.55;
    for(const sp of saved){
      const pts=sp.closed?sp.concat([sp[0]]):sp;
      for(let i=1;i<pts.length;i++){
        const [x0,y0]=pts[i-1],[x1,y1]=pts[i],dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);if(L<1e-6)continue;
        const nx=-dy/L*hw,ny=dx/L*hw;
        bp();mt(x0+nx,y0+ny);lt(x1+nx,y1+ny);lt(x1-nx,y1-ny);lt(x0-nx,y0-ny);cp();fl();
      }
      for(let i=0;i<pts.length;i++){
        const end=!sp.closed&&(i===0||i===pts.length-1);
        if(end?!capR:!joinR)continue;
        bp();ar(pts[i][0],pts[i][1],hw,0,Math.PI*2);fl();
      }
    }
    c.fillStyle=fs;c.globalAlpha=ga;
    bp();for(const sp of saved){if(!sp.length)continue;mt(sp[0][0],sp[0][1]);for(let i=1;i<sp.length;i++)lt(sp[i][0],sp[i][1]);if(sp.closed)cp()}
    subs=saved;
  };
})(ctx);

let W, H, U, dpr, WINDN = 0;
let layers = [], stars = [], flakes = [], bokeh = [];
const SPR = {};
const TAU = Math.PI * 2;
const LIGHTS = ['#ff4040','#ffd34d','#4da6ff','#ff7ad9','#5dff8a','#ff9a3c'];
const WARM = ['#ffe2a0','#ffd27a','#fff1c8','#ffcf8a'];
const COOL = ['#9fd0ff','#ffffff','#7fb0ff','#c8e4ff'];
const REDGOLD = ['#ff4040','#ffd34d','#ff6a4a','#ffe08a'];

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mod=(a,n)=>((a%n)+n)%n;
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
const glowCache={};
function glowSpr(c){
  if(glowCache[c])return glowCache[c];
  const s=64,k=document.createElement('canvas');k.width=k.height=s;const g=k.getContext('2d');
  const [r,gg,b]=hex(c);
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,`rgba(${r},${gg},${b},1)`);gr.addColorStop(.25,`rgba(${r},${gg},${b},.45)`);
  gr.addColorStop(.6,`rgba(${r},${gg},${b},.12)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  return glowCache[c]=k;
}
let REC=null; // when set, glow() records (or swallows) instead of drawing; used while baking layers
function glow(x,y,r,c,a){
  if(REC){const half=((x*7.31+y*3.17+r*1.93)|0)&1;
    if(REC.swallow){if(!REC.split||half)return}       // bake pass: draw the static half, skip the live half
    else{if(REC.split&&!half)return;const m=ctx.getTransform();REC.push({m,x,y,r,c,a,op:ctx.globalCompositeOperation,cx:m.a*x+m.c*y+m.e,ph:Math.random()*TAU,sp:1.6+Math.random()*2.4});return}}
  ctx.globalAlpha=a;ctx.drawImage(glowSpr(c),x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
const DOT=glowSpr('#ffffff');
const starCache={};
function starSpr(c){
  if(starCache[c])return starCache[c];
  const k=document.createElement('canvas');k.width=k.height=24;const g=k.getContext('2d');
  const gr=g.createRadialGradient(12,12,0,12,12,12);gr.addColorStop(0,c);gr.addColorStop(.42,c);gr.addColorStop(.5,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,24,24);return starCache[c]=k;
}
const SPARK=(()=>{const k=document.createElement('canvas');k.width=k.height=48;const g=k.getContext('2d'),x=24,y=24,s=24;
  g.fillStyle='#fff';g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x,y,x+s,y);g.quadraticCurveTo(x,y,x,y+s);g.quadraticCurveTo(x,y,x-s,y);g.quadraticCurveTo(x,y,x,y-s);g.fill();return k})();
function add(on){ctx.globalCompositeOperation=on?'lighter':'source-over'}
function sprite(w,h,ox,oy,fn,res=3){
  const c=document.createElement('canvas');c.width=Math.ceil(w*res);c.height=Math.ceil(h*res);
  const g=c.getContext('2d');g.scale(res,res);g.translate(ox,oy);
  const o={c,w,h,ox,oy};fn(g,o);return o;
}
function blit(s){ctx.drawImage(s.c,-s.ox,-s.oy,s.w,s.h)}
function star5(g,x,y,R,r){
  g.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}
  g.closePath();
}
function sparkle(x,y,s,a){
  if(s<=0||a<=0)return;
  const ga=ctx.globalAlpha;ctx.globalAlpha=ga*Math.min(1,a);ctx.drawImage(SPARK,x-s,y-s,s*2,s*2);ctx.globalAlpha=ga;return;
  ctx.fillStyle=`rgba(255,255,255,${a})`;
  ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();
}

/* ---------- SPRITES (baked once, rendered at 3x) ---------- */
function treeSprite(seed,far,pal){
  const lights=[];
  const s=sprite(150,240,75,225,g=>{
    const r=rng(seed);
    g.fillStyle=far?'#1b1018':'#4a2a16';g.fillRect(-8,-22,16,24);
    for(let i=0;i<5;i++){
      const by=-14-i*36,w=124-i*22,h=64,tip=by-h;
      const P=[[0,tip]],st=6;
      for(let k=1;k<=st;k++){const f=k/st;P.push([-(w/2)*f+(r()-.5)*4,tip+h*f+(r()-.5)*3])}
      for(let m=1;m<6;m++)P.push([-w/2+w*m/6,by+(m%2?8:1)+r()*3]);
      for(let k=st;k>=1;k--){const f=k/st;P.push([(w/2)*f+(r()-.5)*4,tip+h*f+(r()-.5)*3])}
      const path=()=>{g.beginPath();P.forEach((p,j)=>j?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()};
      const gr=g.createLinearGradient(-w/2,0,w/2,0);
      if(far){gr.addColorStop(0,'#081a1f');gr.addColorStop(.6,'#0f3438');gr.addColorStop(1,'#1d5252')}
      else{gr.addColorStop(0,'#0c3320');gr.addColorStop(.55,'#1b6a38');gr.addColorStop(1,'#34a055')}
      path();g.fillStyle=gr;g.fill();
      g.save();path();g.clip();
      const sh=g.createLinearGradient(0,tip,0,by+8);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,10,10,.45)');
      g.fillStyle=sh;g.fillRect(-w,tip,w*2,h+12);
      if(!far){
        for(let n=0;n<70;n++){
          const x=(r()-.5)*w*.95,y=tip+r()*h,d=x<0?-1:1;
          g.strokeStyle=r()<.5?'rgba(0,25,10,.55)':'rgba(130,230,150,.35)';g.lineWidth=1;
          g.beginPath();g.moveTo(x,y);g.lineTo(x+d*(2+r()*4),y+3+r()*3);g.stroke();
        }
      }
      g.restore();
      // snow lumps on the boughs
      for(const side of[-1,1])for(let k=0;k<5;k++){
        const f=.12+k*.17+r()*.05,ex=side*(w/2)*f*.86,ey=tip+h*f-1,rx=6+r()*3;
        g.fillStyle='rgba(160,182,230,.9)';g.beginPath();g.ellipse(ex,ey+2.2,rx,3.2,side*.6,0,TAU);g.fill();
        g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,rx,3.2,side*.6,0,TAU);g.fill();
      }
      g.fillStyle='#fff';g.beginPath();g.moveTo(0,tip-1);g.lineTo(-w*.09,tip+13);g.quadraticCurveTo(0,tip+17,w*.09,tip+13);g.closePath();g.fill();
      for(const m of[1,3,5]){g.fillStyle='rgba(255,255,255,.95)';g.beginPath();g.ellipse(-w/2+w*m/6,by+8,4,2.5,0,0,TAU);g.fill()}
      if(!far&&i<4){
        const x0=-w*.3,x1=w*.3,y0=by-24,cy=by+2;
        g.strokeStyle='#e8c35a';g.lineWidth=2.4;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(0,cy,x1,y0);g.stroke();
        for(let k=0;k<5;k++){
          const u=.12+k*.19,x=(1-u)*(1-u)*x0+u*u*x1,y=(1-u)*(1-u)*y0+2*(1-u)*u*cy+u*u*y0;
          lights.push({x,y:y+1,c:pal[(i*5+k)%pal.length]});
        }
        const oc=['#d62839','#e8c35a','#3a86ff','#c0c8d8'];
        for(let k=0;k<2;k++){
          const x=(r()-.5)*w*.5,y=by-4-r()*6,col=oc[(r()*4)|0];
          const og=g.createRadialGradient(x-1.3,y-1.3,.5,x,y,4.2);og.addColorStop(0,'#fff');og.addColorStop(.25,col);og.addColorStop(1,'rgba(0,0,0,.6)');
          g.fillStyle=og;g.beginPath();g.arc(x,y,4,0,TAU);g.fill();
          g.fillStyle='#e8c35a';g.fillRect(x-1,y-5.2,2,1.6);
        }
      }else if(far){
        for(let k=0;k<3;k++){const f=.3+r()*.6;lights.push({x:(r()-.5)*w*f*.8,y:tip+h*f,c:pal[(r()*pal.length)|0]})}
      }
    }
  });
  s.lights=lights;return s;
}

function houseSprite(seed){
  return sprite(240,220,120,200,g=>{
    const r=rng(seed);
    g.fillStyle='rgba(235,242,255,.95)';g.beginPath();g.ellipse(0,2,94,9,0,0,TAU);g.fill();
    // chimney
    const cg=g.createLinearGradient(34,0,54,0);cg.addColorStop(0,'#7a3b22');cg.addColorStop(1,'#a8573a');
    g.fillStyle=cg;g.fillRect(34,-142,20,50);
    g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;
    for(let y=-140;y<-92;y+=8){g.beginPath();g.moveTo(34,y);g.lineTo(54,y);g.stroke()}
    g.fillStyle='#fff';g.beginPath();g.ellipse(44,-143,13,4.5,0,0,TAU);g.fill();
    // wall
    const wg=g.createLinearGradient(-62,0,62,0);wg.addColorStop(0,'#8e4d24');wg.addColorStop(.6,'#b9692f');wg.addColorStop(1,'#cf8240');
    g.fillStyle=wg;g.fillRect(-62,-80,124,80);
    for(let n=0;n<110;n++){
      g.fillStyle=r()<.5?'rgba(80,35,10,.35)':'rgba(255,200,130,.28)';
      g.beginPath();g.arc(-60+r()*120,-78+r()*76,.7+r()*.9,0,TAU);g.fill();
    }
    const ws=g.createLinearGradient(0,-80,0,0);ws.addColorStop(0,'rgba(0,0,0,0)');ws.addColorStop(1,'rgba(40,15,0,.35)');
    g.fillStyle=ws;g.fillRect(-62,-80,124,80);
    // candy corner posts
    [-62,56].forEach(px=>{
      g.fillStyle='#fff';g.fillRect(px,-80,6,80);g.fillStyle='#d62839';
      for(let y=-80;y<0;y+=10){g.beginPath();g.moveTo(px,y+6);g.lineTo(px+6,y);g.lineTo(px+6,y+4);g.lineTo(px,y+10);g.fill()}
    });
    // shutters + sills
    [[-42,-66],[14,-66]].forEach(([wx,wy])=>{
      g.fillStyle='#2f8f4e';g.fillRect(wx-9,wy,7,28);g.fillRect(wx+30,wy,7,28);
      g.fillStyle='rgba(255,255,255,.35)';g.fillRect(wx-9,wy,2,28);g.fillRect(wx+30,wy,2,28);
      g.fillStyle='#fff';g.beginPath();g.ellipse(wx+14,wy+30,20,3.4,0,0,TAU);g.fill();
      g.fillStyle='rgba(150,170,220,.7)';g.beginPath();g.ellipse(wx+14,wy+32,19,1.6,0,0,TAU);g.fill();
    });
    // door
    g.fillStyle='#fff';g.beginPath();g.moveTo(-17,0);g.lineTo(-17,-36);g.arc(0,-36,17,Math.PI,0);g.lineTo(17,0);g.fill();
    const dg=g.createLinearGradient(-14,0,14,0);dg.addColorStop(0,'#6e1220');dg.addColorStop(1,'#a02034');
    g.fillStyle=dg;g.beginPath();g.moveTo(-14,0);g.lineTo(-14,-36);g.arc(0,-36,14,Math.PI,0);g.lineTo(14,0);g.fill();
    g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;for(let x=-7;x<=7;x+=7){g.beginPath();g.moveTo(x,0);g.lineTo(x,-48);g.stroke()}
    g.fillStyle='#ffd34d';g.beginPath();g.arc(8,-20,2.2,0,TAU);g.fill();
    // wreath on door
    g.strokeStyle='#1f7a3d';g.lineWidth=5;g.beginPath();g.arc(0,-34,8,0,TAU);g.stroke();
    g.strokeStyle='#34a055';g.lineWidth=1.5;g.beginPath();g.arc(0,-34,8,.3,TAU*.6);g.stroke();
    g.fillStyle='#d62839';[[-5,-39],[6,-38],[3,-28],[-7,-31]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],1.5,0,TAU);g.fill()});
    g.beginPath();g.moveTo(0,-26);g.lineTo(-6,-21);g.lineTo(-4,-26);g.lineTo(-7,-30);g.closePath();g.fill();
    g.beginPath();g.moveTo(0,-26);g.lineTo(6,-21);g.lineTo(4,-26);g.lineTo(7,-30);g.closePath();g.fill();
    g.fillStyle='#e8c35a';g.beginPath();g.arc(0,-26,1.8,0,TAU);g.fill();
    // step
    g.fillStyle='#fff';g.fillRect(-20,-2,40,4);
    // roof
    const rp=()=>{g.beginPath();g.moveTo(-90,-74);g.lineTo(0,-148);g.lineTo(90,-74);g.closePath()};
    rp();g.fillStyle='#5e3019';g.fill();
    g.save();rp();g.clip();
    for(let row=8;row>=0;row--){
      const y=-72-row*10;
      for(let x=-98+(row%2?7:0);x<102;x+=14){
        g.fillStyle=(Math.floor(x/14)+row)%3?'#7a4122':'#8b4c2a';
        g.beginPath();g.moveTo(x-7,y-10);g.lineTo(x+7,y-10);g.lineTo(x+7,y-3);g.arc(x,y-3,7,0,Math.PI);g.lineTo(x-7,y-10);g.fill();

}

/* ---------- sky ----------
   Perf: gradient, town glow, moon and vignette are baked once per resize; stars are baked into
   4 twinkle groups; the aurora renders at 1/3 resolution every other frame. */
let SKY=null;
function mkC(w,h,s){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*s));c.height=Math.max(1,Math.ceil(h*s));const g=c.getContext('2d');g.scale(s,s);return [c,g]}
function bakeSky(){
  const main=ctx;
  const [bc,bg]=mkC(W,H,dpr);ctx=bg;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#060b26');g.addColorStop(.45,'#161c58');g.addColorStop(.78,'#43306f');g.addColorStop(1,'#7a4a86');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(W*.5,H*.66,0,W*.5,H*.66,W*.65);
  hg.addColorStop(0,'rgba(255,150,80,.22)');hg.addColorStop(1,'rgba(255,150,80,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,H*.3,W,H*.5);
  const mx=W*.82,my=H*.17,mr=34*U;
  glow(mx,my,mr*5,'#aebcff',.35);glow(mx,my,mr*2.2,'#dfe6ff',.35);
  ctx.globalCompositeOperation='source-over';
  const mg=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);mg.addColorStop(0,'#fffef0');mg.addColorStop(1,'#e8e4c4');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(170,175,160,.35)';
  [[-.3,-.2,.22],[.25,.15,.16],[-.1,.35,.12],[.35,-.35,.1],[-.45,.2,.08]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,TAU);ctx.fill()});
  const SG=[];for(let k=0;k<6;k++)SG.push({sp:.6+k*.4,ph:k*1.7,dots:[],rays:[]});
  stars.forEach((st,i)=>{
    const x=st.x*W,y=st.y*H*.65;
    if(Math.hypot(x-mx,y-my)<mr+2)return;   // the moon sits in front of the stars
    if(i%5<2){const g=SG[i%6];g.dots.push([x,y,st.r*U,st.c]);if(st.big)g.rays.push([x,y]);return}
    ctx=bg;ctx.globalAlpha=.65;ctx.fillStyle=st.c;ctx.beginPath();ctx.arc(x,y,st.r*U,0,TAU);ctx.fill();
    if(st.big){ctx.globalAlpha=.32;ctx.fillRect(x-5*U,y-.4,10*U,.8);ctx.fillRect(x-.4,y-5*U,.8,10*U)}
    ctx.globalAlpha=1;
  });
  const groups=SG;
  const [ac,ag]=mkC(W,H*.62,1/4);
  ag.globalCompositeOperation='lighter';
  ctx=main;
  SKY={bg:bc,stars:groups,aur:ac,aurG:ag,n:0};
}
function drawAurora(a,t){
  a.clearRect(0,0,W,H*.62);
  const cols=[['0,255,170','0,120,255'],['120,80,255','0,255,200'],['0,220,120','180,60,255']];
  for(let b=0;b<3;b++){
    const baseY=H*(.2+.07*b),amp=H*.06,hgt=H*.17;
    const gr=a.createLinearGradient(0,baseY-amp,0,baseY+hgt);
    gr.addColorStop(0,`rgba(${cols[b][0]},0)`);gr.addColorStop(.35,`rgba(${cols[b][0]},.20)`);gr.addColorStop(1,`rgba(${cols[b][1]},0)`);
    a.fillStyle=gr;a.beginPath();
    const f=x=>baseY+Math.sin(x*.004+t*.35+b*2)*amp+Math.sin(x*.011-t*.5+b)*amp*.35;
    a.moveTo(0,f(0));
    for(let x=0;x<=W+30;x+=30)a.lineTo(x,f(x));
    for(let x=W+30;x>=0;x-=30)a.lineTo(x,f(x)+hgt*(.8+.2*Math.sin(x*.01+t+b)));
    a.closePath();a.fill();
  }
}
function drawSky(t){
  const S=SKY;
  ctx.drawImage(S.bg,0,0,W,H);
  for(const g of S.stars){
    ctx.globalAlpha=.3+.7*(.5+.5*Math.sin(t*g.sp+g.ph));
    for(const d of g.dots){const r=d[2]*2.2;ctx.drawImage(starSpr(d[3]),d[0]-r,d[1]-r,r*2,r*2)}

  }

}

  ctx.strokeStyle='#d0202e';ctx.lineWidth=7.5;ctx.beginPath();ctx.moveTo(6,-60);ctx.lineTo(16,-56);ctx.lineTo(26,-50);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(22,-52,4.4,0,TAU);ctx.fill();
  ctx.fillStyle='#17110f';ctx.beginPath();ctx.arc(27,-50,4,0,TAU);ctx.fill();
  // pompom
  const sw=Math.sin(t*7)*2;
  ctx.strokeStyle='#e0303f';ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(-2,-110);ctx.quadraticCurveTo(-8,-112,-12+sw,-106);ctx.stroke();
  const pg=ctx.createRadialGradient(-13+sw,-108,.5,-12+sw,-105,5.5);pg.addColorStop(0,'#fff');pg.addColorStop(1,'#cfd8ee');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(-12+sw,-105,5.2,0,TAU);ctx.fill();
  ctx.restore();
  // reins from hand to each collar
  ctx.strokeStyle='#e8c35a';ctx.lineWidth=1.1;
  D.forEach((d,i)=>{ctx.beginPath();ctx.moveTo(27,-50+b0);ctx.quadraticCurveTo((27+d.x)/2,-30+b0*.3,d.x+26,d.y-8);ctx.stroke()});
  ctx.restore();
}

/* ---------- layers ---------- */
const POOL={tree:{c:'#ffe0a0',r:80,a:.22},house:{c:'#ffb55a',r:120,a:.32},lamp:{c:'#ffc46b',r:130,a:.45,fl:true},fence:{c:'#ffd9a0',r:80,a:.18}};

function makeItem(type,rand,x,far){
  const it={type,x,ph:rand()*10,s:.85+rand()*.3,col:LIGHTS[(rand()*6)|0],
            c1:LIGHTS[(rand()*6)|0],c2:LIGHTS[(rand()*6)|0],c3:LIGHTS[(rand()*6)|0]};
  if(type==='tree'){it.spr=(far?SPR.farTrees:SPR.trees)[(rand()*(far?3:4))|0];it.gifts=!far&&rand()<.45}
  if(type==='house'){it.spr=SPR.houses[(rand()*2)|0];it.boots=rand()<.3}
  if(type==='snowman'){it.spr=SPR.snow[(rand()*4)|0]}
  if(type==='reindeer'){it.flip=rand()<.5;it.red=rand()<.35}
  return it;
}
function buildLayers(){
  const P0=Math.ceil(Math.max(W*2.4,2800*U));
  const defs=[
    {speed:9, base:.60,amp:.018,n1:2,n2:5,p1:1,p2:2,color:['#3b4a8f','#2a3770'],far:true, scale:.55,space:70, pat:['tree','tree','tree','house','tree','tree','tree'],jit:.5,glints:0},
    {speed:26,base:.73,amp:.025,n1:3,n2:7,p1:4,p2:1,color:['#9fb4e0','#7d93c7'],far:false,scale:.82,space:200,pat:['house','tree','snowman','lamp','tree','reindeer','house','fence','tree','snowman','sled','nutcracker'],jit:.2,glints:140},
    {speed:70,base:.90,amp:.015,n1:2,n2:6,p1:2,p2:5,color:['#eef4ff','#cfdcf5'],far:false,scale:1.4,space:330,pat:['candy','tree','present','snowman','lamp','ginger','sled','reindeer','nutcracker','present','tree','fence'],jit:.15,glints:180},
  ];
  layers=defs.map((d,li)=>{
    const rand=rng(777+li*31);
    const P=Math.round(P0*(1+li*.06));
    const L={...d,P,items:[],gl:[]};
    const count=Math.max(4,Math.round(P/(d.space*U)));
    const step=P/count;
    for(let i=0;i<count;i++){
      const it=makeItem(d.pat[i%d.pat.length],rand,i*step+(rand()-.5)*step*d.jit,d.far);
      it.s=it.s*d.scale*U;L.items.push(it);
    }
    for(let i=0;i<d.glints;i++)L.gl.push({x:rand()*P,d:rand(),ph:rand()*TAU,sp:.6+rand()*1.6,s:1.5+rand()*2.5});
    return L;
  });
  stars=[];const r=rng(5);
  for(let i=0;i<190;i++){const k=r();stars.push({x:r(),y:r(),r:.5+r()*1.3,sp:.8+r()*2.5,ph:r()*TAU,big:r()<.07,c:k<.2?'#bcd2ff':k<.35?'#ffe3b8':'#fff'})}
  flakes=[];const rf=rng(99);
  for(let i=0;i<100;i++)flakes.push({k:0,x:rf()*W,y:rf()*H,r:(.8+rf()*1.2)*U,v:(18+rf()*25)*U,ph:rf()*TAU,rot:0,rv:0});
  for(let i=0;i<32;i++)flakes.push({k:1,x:rf()*W,y:rf()*H,r:(2+rf()*2.4)*U,v:(55+rf()*50)*U,ph:rf()*TAU,rot:rf()*TAU,rv:(rf()-.5)*2});
  for(let i=0;i<14;i++)flakes.push({k:2,x:rf()*W,y:rf()*H,r:(6+rf()*10)*U,v:(80+rf()*60)*U,ph:rf()*TAU,rot:0,rv:0});
  bokeh=[];
  for(let i=0;i<10;i++)bokeh.push({x:rf()*W,y:H*(.7+rf()*.3),r:(16+rf()*34)*U,c:LIGHTS[(rf()*6)|0],ph:rf()*TAU});
}
function hillY(L,wx){
  const a=TAU*wx/L.P;
  return H*(L.base+L.amp*Math.sin(a*L.n1+L.p1)+L.amp*.5*Math.sin(a*L.n2+L.p2));
}
/* Perf: each hill layer (ground + static props) is baked once into 1024px-wide strip chunks and slid
   every frame. Light glows of the baked props are recorded while baking and re-drawn live with a
   twinkle. Animated characters (houses with smoke, snowmen, gingerbread, nutcrackers, reindeer) stay live. */
const LIVE={snowman:1,ginger:1,nutcracker:1,reindeer:1};
const ANIM={house:(it,t)=>drawHouseAnim(it,t)};   // baked body + live animated part
let BAKING=false;
const isLive=(L,it)=>!L.far&&LIVE[it.type];
function drawItem(L,it,t){
  ctx.fillStyle='rgba(20,30,80,.2)';ctx.beginPath();ctx.ellipse(8,1,50,6,0,0,TAU);ctx.fill();
  const P=POOL[it.type];
  if(P&&!L.far){
    const fl=P.fl?.85+.15*Math.sin(t*7+it.ph)*Math.sin(t*3.1+it.ph):1;
    ctx.save();ctx.translate(0,4);ctx.scale(1,.2);add(true);glow(0,0,P.r,P.c,P.a*fl);add(false);ctx.restore();
  }
  switch(it.type){
    case 'tree':drawTree(it,t,L.far);break;
    case 'house':L.far?drawFarHouse(it,t):drawHouse(it,t);break;
    case 'snowman':drawSnowman(it,t);break;
    case 'ginger':drawGinger(it,t);break;
    case 'candy':drawCandy(it,t);break;
    case 'present':drawPresents(it,t);break;
    case 'lamp':drawLamp(it,t);break;
    case 'nutcracker':drawNutcracker(it,t);break;
    case 'reindeer':drawReindeer(it,t);break;
    case 'sled':drawSled(it,t);break;
    case 'fence':drawFence(it,t);break;
  }
}
function bakeLayer(L){
  const main=ctx,T0=1.3,CW=1024,margin=240*U*L.scale;
  L.top=Math.max(0,Math.floor(H*(L.base-L.amp*1.6)-260*L.scale*U*1.2));
  const li=layers.indexOf(L),nx=layers[li+1];
  L.bot=nx?Math.min(H,Math.ceil(H*(nx.base+nx.amp*1.6))+4):H;
  const sh=L.bot-L.top;
  L.chunks=[];
  for(let x0=0;x0<L.P;x0+=CW){
    const w=Math.min(CW,L.P-x0);
    const OV=3;   // chunks overlap so bilinear edges never show a seam
    const [c,g]=mkC(w+OV*2,sh,dpr);ctx=g;ctx.translate(-(x0-OV),-L.top);
    const gr=ctx.createLinearGradient(0,H*(L.base-.05),0,H);
    gr.addColorStop(0,L.color[0]);gr.addColorStop(1,L.color[1]);
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(x0-8,H);
    for(let x=x0-8;x<=x0+w+8;x+=4)ctx.lineTo(x,hillY(L,x));
    ctx.lineTo(x0+w+8,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2*U;ctx.beginPath();
    for(let x=x0-8;x<=x0+w+8;x+=4){const y=hillY(L,x);x===x0-8?ctx.moveTo(x,y+1):ctx.lineTo(x,y+1)}
    ctx.stroke();
    BAKING=true;REC=L.far?null:Object.assign([],{swallow:true,split:true});   // far-layer lights are tiny: bake them in
    for(const it of L.items){
      if(isLive(L,it))continue;
      for(const k of [-L.P,0,L.P]){
        const sx=it.x+k;if(sx<x0-margin||sx>x0+w+margin)continue;
        ctx.save();ctx.translate(sx,hillY(L,it.x)+2);ctx.scale(it.s,it.s);drawItem(L,it,T0);ctx.restore();
      }
    }
    REC=null;BAKING=false;
    L.chunks.push({c,x0:x0-OV,w:w+OV*2});
  }
  // second pass: record the glows (in strip coordinates) so they can twinkle live
  const [,dg]=mkC(1,1,1);ctx=dg;
  L.glows=REC=Object.assign([],{split:true});BAKING=true;
  for(const it of L.items){
    if(L.far||isLive(L,it))continue;
    ctx.save();ctx.translate(it.x,hillY(L,it.x)+2);ctx.scale(it.s,it.s);drawItem(L,it,T0);ctx.restore();
  }
  REC=null;BAKING=false;ctx=main;
}
function drawLayer(L,t){
  if(!L.chunks)bakeLayer(L);
  const offRaw=t*L.speed*U,off=mod(offRaw,L.P),sh=L.bot-L.top;
  for(const ch of L.chunks)for(const k of [0,L.P]){
    const sx=ch.x0-off+k;if(sx>=W||sx+ch.w<=0)continue;
    ctx.drawImage(ch.c,sx,L.top,ch.w,sh);
  }
  // glints on the snow
  for(const gl of L.gl){
    const a=Math.pow(Math.max(0,Math.sin(t*gl.sp+gl.ph)),8);
    if(a<.05)continue;
    const sx=mod(gl.x-off,L.P);if(sx>W)continue;
    const hy=hillY(L,gl.x),y=hy+gl.d*(H-hy)*.9+4;
    sparkle(sx,y,gl.s*U,a);
  }
  // twinkling lights of the baked props
  const M=160*U;
  for(const g of L.glows){
    const sx=mod(g.cx-off+M,L.P)-M;if(sx>W+M)continue;
    const m=g.m,dx=sx-g.cx;
    ctx.setTransform(dpr*m.a,dpr*m.b,dpr*m.c,dpr*m.d,dpr*(m.e+dx),dpr*m.f);
    ctx.globalCompositeOperation=g.op;
    ctx.globalAlpha=Math.min(1,g.a*(.6+.5*Math.sin(t*g.sp+g.ph)));
    ctx.drawImage(glowSpr(g.c),g.x-g.r,g.y-g.r,g.r*2,g.r*2);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // animated characters, and the animated bits of baked props
  const margin=240*U*L.scale;
  for(const it of L.items){
    const live=isLive(L,it),anim=!L.far&&ANIM[it.type];
    if(!live&&!anim)continue;
    const sx=mod(it.x-offRaw+margin,L.P)-margin;
    if(sx<-margin||sx>W+margin)continue;
    ctx.save();ctx.translate(sx,hillY(L,it.x)+2);ctx.scale(it.s,it.s);
    if(live)drawItem(L,it,t);else anim(it,t);
    ctx.restore();
  }
}
function drawFog(li){
  const nb=layers[li+1].base;
  const top=H*(nb-.14),bot=H*(nb+.1);
  const g=ctx.createLinearGradient(0,top,0,bot);
  g.addColorStop(0,'rgba(120,135,210,0)');g.addColorStop(.6,'rgba(125,140,215,.2)');g.addColorStop(1,'rgba(125,140,215,0)');
  ctx.fillStyle=g;ctx.fillRect(0,top,W,bot-top);
}

/* ---------- snow, lights, bokeh ---------- */
const SMALL=[];
function drawFlakes(t,dt){
  const wind=Math.sin(t*.25)*22*U;
  for(const f of flakes){
    f.y+=f.v*dt;f.x+=(wind*(f.k===2?1.6:1)+Math.sin(t*1.3+f.ph)*14*U)*dt;f.rot+=f.rv*dt;
    if(f.y>H+30){f.y=-30;f.x=Math.random()*W}
    if(f.x>W+30)f.x=-30;if(f.x<-30)f.x=W+30;
    if(f.k===0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=.7;const r=f.r*2;ctx.drawImage(DOT,f.x-r,f.y-r,r*2,r*2)}
    else if(f.k===1){
      const cs=Math.cos(f.rot)*dpr,sn=Math.sin(f.rot)*dpr;
      ctx.setTransform(cs,sn,-sn,cs,f.x*dpr,f.y*dpr);ctx.globalAlpha=.9;
      const s=f.r*5;ctx.drawImage(SPR.crystal.c,-s/2,-s/2,s,s);
    }else{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=.16;glow(f.x,f.y,f.r,'#e6eeff',1)}
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
}
function drawSegment(i,t,seg){
  const sway=0;
    const x0=i*seg,x1=x0+seg,cy=46*U+sway;
    ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2*U;
    ctx.beginPath();ctx.moveTo(x0,-4);ctx.quadraticCurveTo((x0+x1)/2,cy*2,x1,-4);ctx.stroke();
    const pts=[];
    for(let k=1;k<=4;k++){
      const u=k/5,px=(1-u)*(1-u)*x0+2*(1-u)*u*(x0+x1)/2+u*u*x1;
      const py=(1-u)*(1-u)*-4+2*(1-u)*u*cy*2+u*u*-4;
      pts.push([px,py,LIGHTS[(((i*4+k)%6)+6)%6],.35+.65*(.5+.5*Math.sin(t*2.6+(i*4+k)*.9))]);
    }
    add(true);pts.forEach(p=>glow(p[0],p[1]+7*U,22*U,p[2],p[3]*.55));add(false);
    pts.forEach(p=>{
      ctx.fillStyle=p[2];ctx.globalAlpha=.5+p[3]*.5;
      ctx.beginPath();ctx.ellipse(p[0],p[1]+7*U,4*U,6.5*U,0,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.globalAlpha=.6*p[3];ctx.beginPath();ctx.ellipse(p[0]-1*U,p[1]+5*U,1.2*U,2.2*U,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
    });
    // hanging ornament: star or bauble
    const m=pts[1],hang=26*U+Math.sin(t*1.6+i)*2*U,hx=m[0],hy=m[1]+hang;
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=U;ctx.beginPath();ctx.moveTo(m[0],m[1]+7*U);ctx.lineTo(hx,hy);ctx.stroke();
    if(i%2){
      ctx.fillStyle='#ffd34d';star5(ctx,hx,hy+8*U,9*U,4*U);ctx.fill();
      add(true);glow(hx,hy+8*U,24*U,'#ffd34d',.3);add(false);
    }else{
      const col=['#d62839','#3a86ff','#e8c35a'][((i/2)%3+3)%3|0];
      const bg=ctx.createRadialGradient(hx-3*U,hy+4*U,U,hx,hy+8*U,9*U);bg.addColorStop(0,'#fff');bg.addColorStop(.3,col);bg.addColorStop(1,'rgba(0,0,0,.7)');
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(hx,hy+8*U,8*U,0,TAU);ctx.fill();
      ctx.fillStyle='#e8c35a';ctx.fillRect(hx-2*U,hy-1*U,4*U,3*U);
    }
}
let STR=null;
function bakeString(){
  const main=ctx,seg=150*U,T0=1.3,hgt=150*U;STR=[];
  for(let i=-1;i<Math.ceil(W/seg)+1;i++){
    const x0=i*seg-30*U,w=seg+60*U;
    const [c,g]=mkC(w,hgt,dpr);ctx=g;ctx.translate(-x0,10*U);
    REC=Object.assign([],{swallow:true});drawSegment(i,T0,seg);
    const [,dg]=mkC(1,1,1);ctx=dg;const gl=REC=[];drawSegment(i,T0,seg);REC=null;
    STR.push({c,x0,w,gl,i});
  }
  ctx=main;
}
function drawString(t){
  const hgt=150*U;
  for(const S of STR){
    const dy=Math.sin(t*.9+S.i*.7)*3*U;
    ctx.drawImage(S.c,S.x0,dy-10*U,S.w,hgt);
    for(const g of S.gl){
      const m=g.m;
      ctx.setTransform(dpr*m.a,dpr*m.b,dpr*m.c,dpr*m.d,dpr*m.e,dpr*(m.f+dy));
      ctx.globalCompositeOperation=g.op;
      ctx.globalAlpha=Math.min(1,g.a*(.6+.5*Math.sin(t*g.sp+g.ph)));
      ctx.drawImage(glowSpr(g.c),g.x-g.r,g.y-g.r,g.r*2,g.r*2);
    }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawBokeh(t){
  add(true);
  bokeh.forEach(b=>{glow(b.x,b.y,b.r,b.c,.07+.07*Math.sin(t*.8+b.ph))});
  add(false);
}

/* ---------- loop ---------- */
let QUAL=1;   // 1 = native (max 2x), 0 = 1x render scale for slow devices (TV sticks)
function resize(){
  dpr=QUAL?Math.min(window.devicePixelRatio||1,2):1;
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  U=Math.max(.55,Math.min(H/700,W/900*1.2));
  buildLayers();
  bakeSky();
  layers.forEach(bakeLayer);
  bakeString();
}
initSprites();initSantaSprites();
window.addEventListener('resize',resize);
resize();

let last=performance.now(),T=0;const PF={n:0,s:0};
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(QUAL===1&&dpr>1){PF.n++;if(T>1.5&&!PF.s)PF.s=now,PF.n=0;
    if(PF.s&&now-PF.s>2500){if(PF.n/((now-PF.s)/1000)<40){QUAL=0;document.documentElement.classList.add('lite');resize()}else QUAL=2;PF.s=0}}
  WINDN=Math.sin(T*.25);
  drawSky(T);
  drawSanta(T);
  drawLayer(layers[0],T);
  drawFog(0);
  drawLayer(layers[1],T);
  drawFog(1);
  drawLayer(layers[2],T);
  drawFlakes(T,dt);
  drawBokeh(T);
  drawString(T);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Christmas countdown ---------- */
(function(){
  const $=id=>document.getElementById(id),box=$('cd'),pad=v=>String(v).padStart(2,'0');
  function target(){const n=new Date(),y=n.getFullYear();return n>=new Date(y,11,26)?new Date(y+1,11,25):new Date(y,11,25)}
  function tick(){
    const n=new Date(),t=target();
    if(n>=t){box.classList.add('done');$('cdt').textContent='Merry Christmas!';return}
    box.classList.remove('done');$('cdt').textContent='Christmas is coming';
    let s=Math.floor((t-n)/1000);const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
    $('cdd').textContent=d;$('cdh').textContent=pad(h);$('cdm').textContent=pad(m);$('cds').textContent=pad(s);
  }
  tick();setInterval(tick,1000);
})();
</script>
